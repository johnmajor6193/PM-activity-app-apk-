name: mobile_app
description: "TANFINET Geo-Tagged Fortnightly POP PM Monitoring System - field engineer app"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  image_picker: ^1.1.2 # device camera only (ImageSource.camera) — never the gallery
  geolocator: ^13.0.2 # per-photo live GPS capture
  sqflite: ^2.4.1 # offline local storage for in-progress PM visits/photos
  path_provider: ^2.1.5
  path: ^1.9.0
  image: ^4.3.0 # pure-Dart GPS watermark burn-in (no platform channel)
  connectivity_plus: ^6.1.0 # detects whether sync is possible right now

  # Google Drive upload deliberately added NO googleapis/google_sign_in
  # dependency here: the app never holds Google credentials. Uploads go
  # through the existing backend's POST /visits/{id}/sync over `http`
  # (see data/google_drive_upload_service.dart) — adding either package
  # to this app would violate that design.
  #
  # Still not added (optional, for a later step):
  # workmanager - background/scheduled sync (submission is user-triggered only today)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.4 # real SQLite (via FFI) for testing the repository without a device

flutter:
  uses-material-design: true

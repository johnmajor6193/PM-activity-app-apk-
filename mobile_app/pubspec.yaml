name: mobile_app
description: "TANFINET Geo-Tagged Fortnightly POP PM Monitoring System - field engineer app"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  image_picker: ^1.1.2 # device camera only (ImageSource.camera) — never the gallery
  geolocator: ^13.0.2 # per-photo live GPS capture
  sqflite: ^2.4.1 # offline local storage for in-progress PM visits/photos
  path_provider: ^2.1.5
  path: ^1.9.0
  image: ^4.3.0 # pure-Dart GPS watermark burn-in (no platform channel)

  # Planned for later steps (not added yet, listed here for reference only):
  # connectivity_plus     - network state for sync triggers
  # workmanager            - background sync
  # googleapis / google_sign_in - Google Drive upload

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

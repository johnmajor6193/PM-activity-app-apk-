name: mobile_app
description: "TANFINET Geo-Tagged Fortnightly POP PM Monitoring System - field engineer app"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Planned for later steps (not added yet, listed here for reference only):
  # geolocator            - GPS capture + accuracy
  # camera                - live-only camera capture (no gallery picker)
  # sqflite / drift        - offline local storage
  # connectivity_plus     - network state for sync triggers
  # workmanager            - background sync
  # googleapis / google_sign_in - Google Drive upload
  # dio / http              - REST client for backend API

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
